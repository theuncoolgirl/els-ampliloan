schema_version: '1.0'
status: planned; not installed or verified remotely
ownership: Planner owns schema; Builder implements without renaming
event_name_case: Title Case identical in both vendors
forbidden_events:
- Application Step Completed
properties:
  business_event_id:
    type: string
    description: UUID generated once per logical event; same in both sinks, Amplitude insert_id.
  schema_version:
    type: string
    description: Constant 1.0.
  traffic_type:
    type: string
    description: Preview is not emitted. live_demo only after telemetry authorization.
    enum:
    - live_demo
    - synthetic_population
  page_id:
    type: string
    description: Rendered logical surface.
    enum:
    - home
    - application
    - offers
    - dashboard
    - presenter
  session_id:
    type: string
    description: App-owned session UUID; rotate after 30 minutes inactivity. Not vendor session_id override.
  loan_type:
    type: string
    description: Immutable application loan; unknown only before selection.
    enum:
    - personal
    - mortgage
    - small_business
    - unknown
  application_id:
    type: string
    description: UUID persisted at Application Started; never vendor user ID.
  application_status:
    type: string
    description: Status at event time.
    enum:
    - draft
    - submitted
    - under_review
    - decision_ready
  entry_point:
    type: string
    description: Allowlisted initiating location.
    enum:
    - hero
    - header
    - dashboard
    - application
    - offers
    - help
    - persona_control
  step_id:
    type: string
    description: Shared application step.
    enum:
    - loan_details
    - offers
    - review
  step_index:
    type: integer
    description: 'One-based: loan_details=1, offers=2, review=3.'
  requested_amount:
    type: number
    description: Synthetic USD amount; finite positive, never revenue.
  amount_band:
    type: string
    description: Common USD bands for slicing.
    enum:
    - under_25k
    - 25k_to_under_100k
    - 100k_to_under_500k
    - 500k_plus
  offer_id:
    type: string
    description: Allowlisted synthetic offer fixture ID.
  term_months:
    type: integer
    description: Positive fixture term in months.
  validation_error_code:
    type: string
    description: No field contents/messages.
    enum:
    - required_field
    - invalid_amount
    - missing_offer
    - missing_consent
  elapsed_seconds:
    type: integer
    description: Nonnegative wall-clock seconds since application createdAt, including away time.
  task_id:
    type: string
    description: Allowlisted mock task identifier.
    enum:
    - verify_details
    - review_documents
    - confirm_next_steps
  help_topic:
    type: string
    description: Allowlisted support topic.
    enum:
    - application
    - offers
    - status
    - general
  identity_method:
    type: string
    description: Synthetic fixture flow.
    enum:
    - demo_signup
    - demo_signin
    - demo_signout
  first_touch_source:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  first_touch_medium:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  first_touch_campaign:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  first_touch_channel:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  session_touch_source:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  session_touch_medium:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  session_touch_campaign:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
  session_touch_channel:
    type: string
    description: Allowlisted campaign fixture value; unknown if unavailable; never unrestricted URL/query content.
