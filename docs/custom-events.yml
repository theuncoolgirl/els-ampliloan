    - live_demo
    - synthetic_population
    update: set before dependent event/evaluation
    amplitude: user property
    statsig: custom.traffic_type
  has_saved_application:
    type: boolean
    update: derive from current profile drafts before events
    amplitude: user property
    statsig: custom.has_saved_application
  applications_submitted_count:
    type: integer
    minimum: 0
    update: derive from persisted unique submitted application IDs; do not increment on rerender
    amplitude: user property
    statsig: custom.applications_submitted_count
identity:
  stable_id: app-owned browser UUID -> Amplitude deviceId and Statsig customIDs.stableID; retained on login
  known_id: synthetic profile UUID -> Amplitude userId and Statsig userID
  anonymous: no literal anonymous shared user ID; omit known ID
  experiment_unit: Stable ID; verify matching console metric unit
  logout: emit Signed Out first; clear known identity and active application; rotate stable ID in both tools
  reset_application: retain identity and attribution; new application ID
  reset_new_user: clear profile/applications/attribution; new stable ID
mapping:
  amplitude: track exact event name with typed properties; business_event_id also BaseEvent insert_id; record client
    occurrence time
  statsig: logEvent exact name; value from statsig_value when defined, otherwise omit; metadata all scalar properties
    stringified; null omitted; no assumed dedup by metadata
  profile: Amplitude Identify preserves declared types; Statsig custom preserves declared types (metadata string
    conversion applies only to events)
  technical_events: SDK automatic exposures/replay/page/click telemetry excluded from parity of curated business
    events
invariants:
- All required properties present, non-null, correct declared type/enum. Optional absent is omitted, not empty or
  null.
- loan_type unknown allowed only Rate Check Started, Help Requested and optional identity context before selection.
- All application events carry immutable real selected loan type and application_id.
- Help Requested with application_id must also include application_status and selected loan_type.
- Identity event context omitted after reset; never attach old application to a new profile.
- Application Submitted application_status is submitted; persist transition before dispatch.
- No arbitrary form values, URLs, free text, PII, or document contents in events/replay.
- No principal/revenue event or unload abandonment.
- Preview mode prevents evaluations and event sends before adapters run.
- Metadata IDs support reconciliation, not a guarantee of exact-once delivery.
attribution:
  capture: First eligible landing before router query changes; allowlisted source/medium/campaign fixtures only.
  first_touch: Persist per browser/profile lifecycle, set once; retain across login; reset only new user.
  session_touch: Capture each app session (30m inactivity); retain across in-session route navigation; direct on
    session with no recognized attribution.
  vendor_native: Keep Amplitude built-in marketing attribution; custom fields form cross-platform comparison contract,
    not vendor attribution replacement.
